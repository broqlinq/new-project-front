<div class="table-sm table-responsive-md">
    <table class="table table-hover mw-100">
        <thead>
        <tr *ngIf="forCompany">
            <th class="text-center py-4"
                colspan="8"
                style="font-style: oblique; font-size: 20pt; color: #2b4979">{{company}}</tr>
        <tr>
            <th scope="col" *ngIf="!forCompany">Company</th>
            <th scope="col">Departure Date</th>
            <th scope="col">Return Date</th>
            <th scope="col">Origin</th>
            <th scope="col">Destination</th>
            <th scope="col">One-Way</th>
            <th scope="col">Count</th>
            <th *ngIf="isAdmin" scope="col">Control</th>
            <th *ngIf="!isAdmin" scope="col">Book Tickets</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let t of tickets">
            <td *ngIf="!forCompany">
                <a class="link" (click)="toCompanyPage(t.company)">{{t.company}}</a>
            </td>
            <td>{{t.departureDate | date: 'medium'}}</td>
            <td *ngIf="t.returnDate !== null">{{t.returnDate | date: 'medium'}}</td>
            <td *ngIf="t.returnDate === null">-</td>
            <td>{{t.flight.origin}}</td>
            <td>{{t.flight.destination}}</td>
            <td>
                <span *ngIf="t.returnDate === null" class="material-icons true">check_circle</span>
                <span *ngIf="t.returnDate !== null" class="material-icons false">cancel</span>
            </td>
            <td>{{t.count}}</td>
            <td *ngIf="isAdmin" class="d-flex">
                <button class="btn btn-sm btn-outline-warning mx-2" (click)="editTicket(t)">Edit</button>
                <button class="btn btn-sm btn-outline-danger mx-2" (click)="deleteTicket(t)">Delete</button>
            </td>
            <td *ngIf="!isAdmin" class="d-flex">
                <app-ticket-booking [ticket]="t" (onBookTickets)="bookTickets($event)"></app-ticket-booking>
            </td>
        </tr>
        </tbody>
    </table>
</div>
