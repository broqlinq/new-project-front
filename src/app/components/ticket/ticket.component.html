<div class="container">
    <h3 class="mt-4">Edit ticket</h3>
    <form [formGroup]="form">
        <div class="row">
            <div class="col-md-6">
                <div class="mat-form-field-flex">
                    <mat-form-field appearance="outline">
                        <mat-label>Departure date</mat-label>
                        <input [matDatepicker]="departureDate" formControlName="departureDate" matInput required>
                        <mat-error>Departure date is required</mat-error>
                        <mat-datepicker-toggle [for]="departureDate" matSuffix></mat-datepicker-toggle>
                        <mat-datepicker #departureDate></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="mat-form-field-flex">
                    <mat-form-field appearance="outline">
                        <mat-label>Return date</mat-label>
                        <input [matDatepicker]="returnDate" formControlName="returnDate" matInput>
                        <mat-datepicker-toggle [for]="returnDate" matSuffix></mat-datepicker-toggle>
                        <mat-datepicker #returnDate></mat-datepicker>
                    </mat-form-field>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mat-form-field-flex">
                    <mat-form-field appearance="outline">
                        <mat-label>Company</mat-label>
                        <mat-select formControlName="companyId" required>
                            <mat-option *ngFor="let company of companies"
                                        [value]="company.id">{{company.name}}
                            </mat-option>
                        </mat-select>
                        <mat-error>Company is required</mat-error>
                    </mat-form-field>
                </div>
                <div class="mat-form-field-flex">
                    <mat-form-field appearance="outline">
                        <mat-label>Flight</mat-label>
                        <mat-select formControlName="flightId" required >
                            <mat-option *ngFor="let flight of flights"
                                        [value]="flight.id">{{flight.id + ': ' + flight.origin + ' to ' + flight.destination}}
                            </mat-option>
                        </mat-select>
                        <mat-error>Flight is required</mat-error>
                    </mat-form-field>
                </div>
            </div>
        </div>
        <mat-form-field appearance="outline">
            <mat-label>Available tickets</mat-label>
            <input formControlName="count" matInput min="1" required type="number">
            <mat-error>Ticket count is required</mat-error>
        </mat-form-field>
        <div class="col-md-6 d-flex justify-content-center">
            <button (click)="saveChanges()"
                    [disabled]="!form.valid"
                    class="mx-5"
                    color="primary"
                    mat-stroked-button>Save
            </button>
            <button (click)="goBack()"
                    class="mx-5"
                    color="primary"
                    mat-stroked-button>Back
            </button>
        </div>
    </form>
</div>
