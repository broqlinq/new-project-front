<div class="container">
    <form [formGroup]="form">
        <div class="row">
            <div class="col-sm-6 align-content-sm-start">
                <mat-form-field appearance="fill" class="mat-form-field-flex justify-content-center">
                    <mat-label>Origin</mat-label>
                    <mat-select formControlName="origin">
                        <mat-option [value]="">-</mat-option>
                        <mat-option *ngFor="let city of cities" [value]="city">{{city}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="fill" class="mat-form-field-flex justify-content-center">
                    <mat-label>Destination</mat-label>
                    <mat-select formControlName="destination">
                        <mat-option [value]="">-</mat-option>
                        <mat-option *ngFor="let city of cities" [value]="city">{{city}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-sm-6 align-content-sm-start">
                <mat-form-field appearance="fill" class="mat-form-field-flex justify-content-center">
                    <mat-label>Departure date</mat-label>
                    <input [matDatepicker]="departureDate" formControlName="departureDate" matInput>
                    <mat-datepicker-toggle [for]="departureDate" matSuffix></mat-datepicker-toggle>
                    <mat-datepicker #departureDate></mat-datepicker>
                </mat-form-field>
                <mat-form-field appearance="fill" class="mat-form-field-flex justify-content-center">
                    <mat-label>Return date</mat-label>
                    <input [matDatepicker]="returnDate" formControlName="departureDate" matInput>
                    <mat-datepicker-toggle [for]="returnDate" matSuffix></mat-datepicker-toggle>
                    <mat-datepicker #returnDate></mat-datepicker>
                </mat-form-field>
            </div>
        </div>
        <div class="d-flex justify-content-center m-4">
            <mat-radio-group formControlName="oneWay" value="all">
                <mat-radio-button class="m-4" value="oneWay">One-Way</mat-radio-button>
                <mat-radio-button class="m-4" value="twoWay">Two-Way</mat-radio-button>
                <mat-radio-button class="m-4" value="all">All</mat-radio-button>
            </mat-radio-group>
        </div>
        <div class="row justify-content-center">
            <button class="btn btn-outline-dark" (click)="filter()">Search</button>
        </div>
    </form>
</div>
