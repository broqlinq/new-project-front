<div *ngIf="!isAdmin">
    <app-ticket-filter (onFilter)="filterTickets($event)"></app-ticket-filter>
</div>
<div *ngIf="isAdmin">
    <mat-tab-group>
        <mat-tab label="Users">
            <app-user-form></app-user-form>
        </mat-tab>
        <mat-tab label="Tickets">
            <app-ticket-form (ticketCreated)="updateTable()"></app-ticket-form>
        </mat-tab>
    </mat-tab-group>
</div>
<hr>
<app-tickets></app-tickets>
